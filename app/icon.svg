<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="forge" x1="58" y1="39" x2="82" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>

  <!-- edges: two inputs converging into the forged node -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <path d="M40 34 L60 50"/>
    <path d="M40 66 L60 50"/>
  </g>

  <!-- input nodes (diagram boxes) -->
  <g fill="#E2E8F0">
    <rect x="18" y="26" width="22" height="16" rx="4"/>
    <rect x="18" y="58" width="22" height="16" rx="4"/>
  </g>

  <!-- forged output node -->
  <rect x="58" y="39" width="24" height="22" rx="5" fill="url(#forge)"/>

  <!-- forge spark -->
  <path d="M82 28 l2.2 4.8 4.8 2.2 -4.8 2.2 -2.2 4.8 -2.2 -4.8 -4.8 -2.2 4.8 -2.2 z" fill="#FCD34D"/>
</svg>
